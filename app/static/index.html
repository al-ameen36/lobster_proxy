<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobster Trap</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a1628;
      --surface: #0f1f38;
      --surface2: #152847;
      --border: #1e3a5f;
      --text: #e0e8f0;
      --text-muted: #7a9bb5;
      --accent: #e63946;
      --green: #06d6a0;
      --red: #e63946;
      --amber: #f4a261;
      --blue: #4cc9f0;
      --purple: #b185db;
      --cyan: #06d6a0;
      --teal: #118ab2;
      --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px 0;
    }

    .sidebar-brand {
      padding: 0 16px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .sidebar-brand h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sidebar-brand .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .sidebar-nav {
      list-style: none;
    }

    .sidebar-nav li {
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      border-left: 3px solid transparent;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-nav li:hover {
      color: var(--text);
      background: var(--surface2);
    }

    .sidebar-nav li.active {
      color: var(--text);
      border-left-color: var(--accent);
      background: var(--surface2);
    }

    .connection-status {
      margin-top: auto;
      padding: 12px 16px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .status-dot.connected {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .status-dot.disconnected {
      background: var(--red);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
    }

    .toolbar select,
    .toolbar button {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .toolbar button:hover {
      border-color: var(--accent);
    }

    .toolbar label {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .view {
      display: none;
      flex: 1;
      overflow: auto;
    }

    .view.active {
      display: flex;
      flex-direction: column;
    }

    /* ── Feed ── */
    .feed-table-wrap {
      flex: 1;
      overflow: auto;
    }

    table.feed {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.feed th {
      position: sticky;
      top: 0;
      background: var(--surface);
      padding: 6px 10px;
      text-align: left;
      color: var(--text-muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      z-index: 1;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    table.feed td {
      padding: 5px 10px;
      border-bottom: 1px solid rgba(30, 58, 95, 0.5);
      white-space: nowrap;
    }

    table.feed tr {
      cursor: pointer;
      transition: background 0.1s;
    }

    table.feed tr:hover {
      background: var(--surface2);
    }

    table.feed tr.selected {
      background: var(--surface2);
      outline: 1px solid var(--border);
    }

    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    /* ── Badges ── */
    .badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-allow {
      background: rgba(6, 214, 160, 0.12);
      color: var(--green);
    }

    .badge-deny {
      background: rgba(230, 57, 70, 0.15);
      color: var(--red);
    }

    .badge-log {
      background: rgba(76, 201, 240, 0.12);
      color: var(--blue);
    }

    .badge-human_review {
      background: rgba(244, 162, 97, 0.15);
      color: var(--amber);
    }

    .badge-quarantine {
      background: rgba(177, 133, 219, 0.12);
      color: var(--purple);
    }

    .badge-modify {
      background: rgba(6, 214, 160, 0.12);
      color: var(--cyan);
    }

    .badge-rate_limit {
      background: rgba(244, 162, 97, 0.15);
      color: var(--amber);
    }

    .badge-llm_timeout {
      background: rgba(244, 162, 97, 0.15);
      color: var(--amber);
    }

    .badge-llm_error {
      background: rgba(230, 57, 70, 0.15);
      color: var(--red);
    }

    .badge-egress {
      background: rgba(177, 133, 219, 0.08);
      color: var(--purple);
    }

    .risk-bar {
      display: inline-block;
      width: 50px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      vertical-align: middle;
      margin-right: 4px;
    }

    .risk-bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    /* ── Detail panel ── */
    .detail-panel {
      position: fixed;
      top: 0;
      right: -520px;
      width: 520px;
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--border);
      transition: right 0.25s ease;
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-panel.open {
      right: 0;
    }

    .detail-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-header h3 {
      font-size: 14px;
      font-weight: 600;
    }

    .detail-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
    }

    .detail-close:hover {
      color: var(--text);
    }

    .detail-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .detail-section {
      margin-bottom: 18px;
    }

    .detail-section h4 {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 4px 12px;
      font-size: 12px;
    }

    .detail-grid .label {
      color: var(--text-muted);
    }

    .detail-grid .value {
      color: var(--text);
      word-break: break-all;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag {
      padding: 2px 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      font-size: 11px;
    }

    /* Message bubbles in detail */
    .msg-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 6px;
      max-height: 180px;
      overflow-y: auto;
      color: var(--text);
      line-height: 1.6;
    }

    .msg-box.response {
      background: var(--bg);
      color: var(--text-muted);
    }

    .msg-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 12px;
    }


    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      font-size: 14px;
      gap: 8px;
    }

    .empty-state .icon {
      font-size: 36px;
      opacity: 0.3;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>&#129438; Lobster Trap</h1>
      <div class="subtitle">Prompt Inspection Proxy</div>
    </div>
    <ul class="sidebar-nav">
      <li class="active" data-view="feed">&#9654; Audit Log</li>
    </ul>
    <div class="connection-status">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar" id="feedToolbar">
      <select id="actionFilter">
        <option value="">All Actions</option>
        <option value="ALLOW">ALLOW</option>
        <option value="DENY">DENY</option>
        <option value="LOG">LOG</option>
        <option value="HUMAN_REVIEW">HUMAN_REVIEW</option>
        <option value="QUARANTINE">QUARANTINE</option>
      </select>
      <label><input type="checkbox" id="autoScroll" checked> Auto-scroll</label>
      <button id="clearBtn">Clear</button>
      <span id="eventCount" style="margin-left:auto;color:var(--text-muted);font-size:12px;"></span>
    </div>

    <!-- Audit Log -->
    <div class="view active" id="feedView">
      <div class="feed-table-wrap" id="feedWrap">
        <table class="feed">
          <thead>
            <tr>
              <th style="width:76px">Time</th>
              <th style="width:80px">Model</th>
              <th style="width:60px">Dir</th>
              <th style="width:100px">Action</th>
              <th style="width:160px">Rule / Reason</th>
              <th style="width:80px">Risk</th>
              <th>User Message</th>
            </tr>
          </thead>
          <tbody id="feedBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="feedEmpty">
        <div class="icon">&#129438;</div>
        <div>No events yet. Send requests through the proxy to see them here.</div>
      </div>
    </div>

    <!-- Detail panel -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <h3 id="detailTitle">Event Details</h3>
        <button class="detail-close" id="detailClose">&times;</button>
      </div>
      <div class="detail-body" id="detailBody"></div>
    </div>

    <script>
      (function () {
        'use strict';

        let events = [], ws = null;
        let selectedEvent = null, actionFilter = '';

        const feedBody = document.getElementById('feedBody');
        const feedWrap = document.getElementById('feedWrap');
        const feedEmpty = document.getElementById('feedEmpty');
        const feedToolbar = document.getElementById('feedToolbar');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const actionFilterEl = document.getElementById('actionFilter');
        const autoScrollEl = document.getElementById('autoScroll');
        const eventCountEl = document.getElementById('eventCount');
        const detailPanel = document.getElementById('detailPanel');
        const detailBody = document.getElementById('detailBody');

        actionFilterEl.addEventListener('change', () => { actionFilter = actionFilterEl.value; renderFeed(); });
        document.getElementById('clearBtn').addEventListener('click', () => { events = []; renderFeed(); });
        document.getElementById('detailClose').addEventListener('click', closeDetail);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

        function closeDetail() {
          detailPanel.classList.remove('open');
          selectedEvent = null;
          feedBody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
        }

        // ── WebSocket ──
        function connect() {
          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          ws = new WebSocket(proto + '//' + location.hostname + ':8000/v1/ws');

          ws.onopen = () => {
            statusDot.className = 'status-dot connected';
            statusText.textContent = 'Connected';
          };
          ws.onclose = () => {
            statusDot.className = 'status-dot disconnected';
            statusText.textContent = 'Disconnected';
            setTimeout(connect, 3000);
          };
          ws.onerror = () => ws.close();

          ws.onmessage = e => {
            try {
              const msg = JSON.parse(e.data);
              if (msg.type === 'ping') return;
              if (msg.type === 'initial_state') {
                events = msg.payload.events || [];
                renderFeed();
              } else if (msg.type === 'event') {
                const dup = events.some(ev => ev.request_id && ev.request_id === msg.payload.request_id);
                if (!dup) {
                  events.push(msg.payload);
                  if (events.length > 500) events.shift();
                  appendFeedRow(msg.payload);
                }
              } else if (msg.type === 'stats_update') {
                // stats view removed — ignore
              }
            } catch (err) { console.error('WS parse error', err); }
          };
        }

        // ── Feed rendering ──
        function filteredEvents() {
          const sorted = [...events].sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
          return actionFilter ? sorted.filter(e => e.action === actionFilter) : sorted;
        }

        function renderFeed() {
          feedBody.innerHTML = '';
          const filtered = filteredEvents();
          feedEmpty.style.display = filtered.length === 0 ? 'flex' : 'none';
          feedWrap.style.display = filtered.length > 0 ? 'block' : 'none';
          filtered.forEach(evt => appendFeedRow(evt, false));
          updateEventCount();
          if (autoScrollEl.checked) scrollFeed();
        }

        function appendFeedRow(evt, doScroll) {
          if (actionFilter && evt.action !== actionFilter) return;

          feedEmpty.style.display = 'none';
          feedWrap.style.display = 'block';

          const risk = resolveRisk(evt);
          const riskColor = risk < 0.3 ? 'var(--green)' : risk < 0.6 ? 'var(--amber)' : 'var(--red)';

          const ts = Number(evt.timestamp);
          const time = new Date(ts > 1e12 ? ts : ts * 1000);
          const timeStr = isNaN(time.getTime()) ? '—' : time.toLocaleTimeString('en-US', { hour12: false });

          const action = (evt.action || 'ALLOW').toUpperCase();
          const model = (evt.model || '').split('/').pop().split(':')[0]; // shorten long model names

          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + esc(timeStr) + '</td>' +
            '<td><div class="truncate" style="max-width:80px;color:var(--text-muted)">' + esc(model) + '</div></td>' +
            '<td><span class="badge badge-' + esc((evt.direction || 'ingress').toLowerCase()) + '">' + esc(evt.direction || 'ingress') + '</span></td>' +
            '<td><span class="badge badge-' + esc(action.toLowerCase()) + '">' + esc(action) + '</span></td>' +
            '<td><div class="truncate" style="max-width:160px">' + esc(evt.rule_name || evt.deny_message || '—') + '</div></td>' +
            '<td><span class="risk-bar"><span class="risk-bar-fill" style="width:' + (risk * 100).toFixed(0) + '%;background:' + riskColor + '"></span></span>' + risk.toFixed(2) + '</td>' +
            '<td><div class="truncate" style="max-width:300px;color:var(--text-muted)">' + esc((evt.user_message || '').slice(0, 120)) + '</div></td>';

          tr.addEventListener('click', () => showDetail(evt, tr));
          feedBody.appendChild(tr);
          updateEventCount();

          if (doScroll !== false && autoScrollEl.checked) scrollFeed();
        }

        function scrollFeed() { requestAnimationFrame(() => { feedWrap.scrollTop = feedWrap.scrollHeight; }); }
        function updateEventCount() {
          const n = filteredEvents().length;
          eventCountEl.textContent = n + ' event' + (n !== 1 ? 's' : '');
        }

        function resolveRisk(evt) {
          const meta = evt.metadata || {};
          if (typeof meta.risk_score === 'number') return meta.risk_score;
          const nested = meta.ingress || meta.egress || {};
          return (nested.detected && typeof nested.detected.risk_score === 'number')
            ? nested.detected.risk_score : 0;
        }

        // ── Detail panel ──
        function showDetail(evt, tr) {
          feedBody.querySelectorAll('tr.selected').forEach(r => r.classList.remove('selected'));
          if (tr) tr.classList.add('selected');
          selectedEvent = evt;

          const meta = evt.metadata || {};
          const action = (evt.action || 'ALLOW').toUpperCase();
          const risk = resolveRisk(evt);
          const riskColor = risk < 0.3 ? 'var(--green)' : risk < 0.6 ? 'var(--amber)' : 'var(--red)';

          // Flatten nested Lobstertrap signals
          const signals = meta.ingress?.detected || meta.egress?.detected || meta;

          let html = '';

          // Overview
          html += section('Overview',
            grid([
              ['Request ID', esc(evt.request_id || '—')],
              ['Timestamp', esc(new Date(Number(evt.timestamp) > 1e12 ? Number(evt.timestamp) : Number(evt.timestamp) * 1000).toISOString())],
              ['Model', esc(evt.model || '—')],
              ['Direction', badge(evt.direction || 'ingress')],
              ['Action', badge(action.toLowerCase(), action)],
              ['Rule', esc(evt.rule_name || '—')],
              ...(evt.blocked ? [['Blocked', '<span style="color:var(--red)">YES</span>']] : []),
              ...(evt.deny_message ? [['Reason', esc(evt.deny_message)]] : []),
            ])
          );

          // LLM Interaction — the key addition vs vanilla Lobstertrap
          if (evt.user_message || evt.final_response) {
            html += '<div class="detail-section"><h4>LLM Interaction</h4>';
            if (evt.user_message) {
              html += '<div class="msg-label">User Message</div>';
              html += '<div class="msg-box">' + esc(evt.user_message) + '</div>';
            }
            if (evt.final_response) {
              html += '<div class="msg-label">Response' + (evt.blocked ? ' (LLM-generated rejection)' : '') + '</div>';
              html += '<div class="msg-box response">' + esc(evt.final_response) + '</div>';
            }
            html += '</div>';
          }

          // Classification
          html += section('Classification',
            grid([
              ['Risk Score', '<span class="risk-bar" style="width:80px"><span class="risk-bar-fill" style="width:' + (risk * 100).toFixed(0) + '%;background:' + riskColor + '"></span></span> ' + risk.toFixed(3)],
              ['Intent', esc(signals.intent_category || '—')],
              ['Confidence', ((signals.intent_confidence || 0)).toFixed(3)],
              ['Token Count', esc(signals.token_count || '—')],
            ])
          );

          // DPI Signals
          const dpiRows = [
            ['Injection', signals.contains_injection_patterns],
            ['Malware Request', signals.contains_malware_request],
            ['Phishing/Fraud', signals.contains_phishing_patterns],
            ['Harm/Violence', signals.contains_harm_patterns],
            ['Data Exfiltration', signals.contains_exfiltration],
            ['Obfuscation', signals.contains_obfuscation],
            ['Role Impersonation', signals.contains_role_impersonation],
            ['PII Request', signals.contains_pii_request],
            ['PII (in text)', signals.contains_pii],
            ['Credentials', signals.contains_credentials],
            ['System Commands', signals.contains_system_commands],
            ['Code', signals.contains_code],
            ['File Paths', signals.contains_file_paths],
            ['Sensitive Paths', signals.contains_sensitive_paths],
            ['URLs', signals.contains_urls],
          ].filter(([, v]) => v !== undefined);

          if (dpiRows.length) {
            html += section('DPI Signals',
              grid(dpiRows.map(([name, val]) => [
                name,
                '<span style="color:' + (val ? 'var(--red)' : 'var(--green)') + '">' + (val ? 'YES' : 'no') + '</span>'
              ]))
            );
          }

          // Extracted data
          const tPaths = signals.target_paths || [];
          const tDomains = signals.target_domains || [];
          const tCmds = signals.target_commands || [];
          if (tPaths.length || tDomains.length || tCmds.length) {
            html += '<div class="detail-section"><h4>Extracted Data</h4>';
            if (tPaths.length) html += tagGroup('Paths', tPaths);
            if (tDomains.length) html += tagGroup('Domains', tDomains);
            if (tCmds.length) html += tagGroup('Commands', tCmds);
            html += '</div>';
          }

          detailBody.innerHTML = html;
          detailPanel.classList.add('open');
        }

        // ── HTML helpers ──
        function section(title, content) {
          return '<div class="detail-section"><h4>' + esc(title) + '</h4>' + content + '</div>';
        }
        function grid(rows) {
          return '<div class="detail-grid">' +
            rows.map(([l, v]) => '<div class="label">' + esc(l) + '</div><div class="value">' + v + '</div>').join('') +
            '</div>';
        }
        function badge(cls, text) {
          return '<span class="badge badge-' + esc(cls) + '">' + esc(text || cls.toUpperCase()) + '</span>';
        }
        function tagGroup(label, items) {
          return '<div style="margin-bottom:8px"><div style="color:var(--text-muted);font-size:11px;margin-bottom:4px">' + esc(label) + '</div>' +
            '<div class="tag-list">' + items.map(i => '<span class="tag">' + esc(i) + '</span>').join('') + '</div></div>';
        }


        function esc(s) {
          if (s == null) return '';
          const d = document.createElement('div');
          d.textContent = String(s);
          return d.innerHTML;
        }

        connect();
      })();
    </script>
</body>

</html>
